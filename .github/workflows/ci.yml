# Testes e verificação de idiomas a cada push e pull request.
# Linux roda a interface com xvfb (tela virtual); macOS é a plataforma do app.
name: CI
on:
  push:
  pull_request:
jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_locales.py
      - run: xvfb-run -a python -m unittest discover -s tests -t .

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_locales.py
      - run: python -m unittest discover -s tests -t .
